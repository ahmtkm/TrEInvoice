name: Bug report
description: Report a reproducible defect in TrEInvoice.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include real invoice data, personal data, credentials, or tax identifiers.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal code or fictional XML that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TrEInvoice version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
