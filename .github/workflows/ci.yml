name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TrEInvoice.sln
      - name: Build
        run: dotnet build TrEInvoice.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test TrEInvoice.sln --configuration Release --no-build
