name: Publish NuGet packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine and verify package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != v* ]]; then
              echo "Release tag must begin with v (received ${tag})." >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/TrEInvoice.Core/TrEInvoice.Core.csproj | head -n 1)"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not determine the package version." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Package version is not an accepted SemVer version: ${version}." >&2
            exit 1
          fi

          for project in \
            src/TrEInvoice.Core/TrEInvoice.Core.csproj \
            src/TrEInvoice.Calculation/TrEInvoice.Calculation.csproj \
            src/TrEInvoice.Validation/TrEInvoice.Validation.csproj \
            src/TrEInvoice.Ubl/TrEInvoice.Ubl.csproj; do
            project_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' "${project}" | head -n 1)"
            if [[ "${project_version}" != "${version}" ]]; then
              echo "${project} declares ${project_version}; expected ${version}. Update package versions before publishing." >&2
              exit 1
            fi
          done

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore TrEInvoice.sln

      - name: Build
        run: dotnet build TrEInvoice.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TrEInvoice.sln --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for project in \
            src/TrEInvoice.Core/TrEInvoice.Core.csproj \
            src/TrEInvoice.Calculation/TrEInvoice.Calculation.csproj \
            src/TrEInvoice.Validation/TrEInvoice.Validation.csproj \
            src/TrEInvoice.Ubl/TrEInvoice.Ubl.csproj; do
            dotnet pack "${project}" --configuration Release --no-build --no-restore --output artifacts
          done
          package_count="$(find artifacts -maxdepth 1 -type f -name '*.nupkg' | wc -l)"
          if [[ "${package_count}" -ne 4 ]]; then
            echo "Expected exactly four packages, found ${package_count}." >&2
            exit 1
          fi

      - name: Refuse already-published package versions
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          for package_id in TrEInvoice.Core TrEInvoice.Calculation TrEInvoice.Validation TrEInvoice.Ubl; do
            package_lc="$(printf '%s' "${package_id}" | tr '[:upper:]' '[:lower:]')"
            package_url="https://api.nuget.org/v3-flatcontainer/${package_lc}/${PACKAGE_VERSION}/${package_lc}.${PACKAGE_VERSION}.nupkg"
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --head "${package_url}")"
            if [[ "${status}" == "200" ]]; then
              echo "${package_id} ${PACKAGE_VERSION} is already published; refusing to republish." >&2
              exit 1
            elif [[ "${status}" != "404" ]]; then
              echo "NuGet version preflight returned HTTP ${status} for ${package_id} ${PACKAGE_VERSION}." >&2
              exit 1
            fi
          done

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ahmtkm

      - name: Push packages
        shell: bash
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
